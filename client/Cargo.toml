[package]
name = "koseka-website-client"
version = "0.0.0"
edition = "2024"

[build-dependencies]

[dev-dependencies]

[dependencies]
sycamore = "0.9.2"
sycamore-router = "0.9.2"
wasm-bindgen = "0.2.104"
web-sys = { version = "0.3.81", features = ["CssStyleDeclaration", "HtmlElement"] }
comrak = "0.44.0"

[profile.release]
panic = "abort" # Does not perform backtrace for panic on release builds.
codegen-units = 1 # Performs optimizations on all codegen units.
opt-level = "s" # Optimizes for size, use "z" to optimize more aggressively.
lto = true # Enables link time optimization.
